services:
  - type: web
    name: hydra-iptv
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      # ✅ لا تضع PORT هنا، دع Render يديره تلقائياً
