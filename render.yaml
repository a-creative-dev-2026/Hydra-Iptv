services:
  - type: web
    name: hydra-iptv
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      - key: TELEGRAM_API_ID
        value: YOUR_API_ID
      - key: TELEGRAM_API_HASH
        value: YOUR_API_HASH
      - key: TELEGRAM_PHONE
        value: YOUR_PHONE_NUMBER
      - key: SERPAPI_KEY
        value: YOUR_SERPAPI_KEY  # اختياري
