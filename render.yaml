services:
  - type: web
    name: hydra-iptv
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      # ملاحظة: تم حذف PORT من هنا، لأن Render يديرها تلقائياً
