<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra IPTV | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fas fa-dragon text-3xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold gradient-text">Hydra IPTV v4.0</h1>
                    <p class="text-slate-400">خادم البث الذكي والمحترف</p>
                </div>
            </div>
            <div class="flex gap-4">
                <div class="glass px-6 py-3 rounded-xl flex items-center gap-3">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="font-bold">الحالة: متصل</span>
                </div>
            </div>
        </header>

        <!-- Search Section -->
        <section class="mb-12">
            <div class="glass p-6 rounded-3xl shadow-2xl">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="ابحث عن قناة (مثال: beIN Sports, CNN, MBC)..." 
                        class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-2xl py-4 px-6 pr-14 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-lg">
                    <button onclick="searchChannel()" class="absolute left-4 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl transition-all font-bold">
                        بحث
                    </button>
                    <i class="fas fa-search absolute right-6 top-1/2 -translate-y-1/2 text-slate-500 text-xl"></i>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="resultsSection" class="hidden">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <i class="fas fa-list-ul text-blue-500"></i>
                نتائج البحث
            </h2>
            <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be injected here -->
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-20">
            <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-xl text-slate-400">جاري البحث في المصادر العالمية...</p>
        </div>
    </div>

    <script>
        async function searchChannel() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const loading = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            const resultsGrid = document.getElementById('resultsGrid');

            loading.classList.remove('hidden');
            resultsSection.classList.add('hidden');
            resultsGrid.innerHTML = '';

            try {
                const response = await fetch(`/search/${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.found) {
                    data.channels.forEach(channel => {
                        const card = document.createElement('div');
                        card.className = 'glass p-6 rounded-2xl hover:border-blue-500/50 transition-all group';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-tv text-blue-400 text-xl"></i>
                                </div>
                                <span class="bg-green-500/10 text-green-500 text-xs font-bold px-3 py-1 rounded-full">نشط</span>
                            </div>
                            <h3 class="text-xl font-bold mb-2 truncate">${channel.name}</h3>
                            <p class="text-slate-500 text-sm mb-6 truncate">${channel.url}</p>
                            <div class="flex gap-2">
                                <a href="/channel/${encodeURIComponent(channel.name)}" target="_blank" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-center font-bold transition-all">
                                    <i class="fas fa-play ml-2"></i> تشغيل
                                </a>
                                <button onclick="copyToClipboard('${channel.url}')" class="w-12 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                        `;
                        resultsGrid.appendChild(card);
                    });
                    resultsSection.classList.remove('hidden');
                } else {
                    alert('لم يتم العثور على نتائج');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('حدث خطأ أثناء البحث');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('تم نسخ الرابط!');
        }

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchChannel();
        });
    </script>
</body>
</html>
