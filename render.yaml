services:
  - type: web
    name: hydra-iptv-v4
    env: python
    buildCommand: pip install -r requirements.txt
    # Explicitly force 5000 in start command
    startCommand: uvicorn main:app --host 0.0.0.0 --port 5000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5000
